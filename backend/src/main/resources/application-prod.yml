# 팀 공용/배포: PostgreSQL. 스키마 변경은 PL 권한이므로 자동 변경(ddl-auto)은 끕니다.

spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: WARN

# 기존 Supabase 상담 테이블 사용
pickme:
  agent:
    enabled: true
  conversation:
    enabled: true
    retention-days: 30
