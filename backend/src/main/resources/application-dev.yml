spring:
  config:
    import: "file:./.env.dev[.properties]"

  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: WARN

pickme:
  agent:
    enabled: true
  conversation:
    enabled: true
    retention-days: 30
