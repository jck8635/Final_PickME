spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./admin-local.properties"
  application:
    name: pickme-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 3s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
pickme:
  jwt-secret: ${JWT_SECRET:}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  ai-server-url: ${AI_SERVER_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password-hash: ${ADMIN_PASSWORD_HASH:}
